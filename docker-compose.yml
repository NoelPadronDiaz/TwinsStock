services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: twinsstock
      POSTGRES_PASSWORD: twinsstock
      POSTGRES_DB: twinsstock
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twinsstock']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: twinsstock
      DB_PASSWORD: twinsstock
      DB_DATABASE: twinsstock
      DB_SSL: 'false'
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env.docker}
      JWT_EXPIRES_IN: 12h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env.docker}
      ADMIN_NAME: Administrador
      # Bind mounts on Windows/Docker Desktop don't propagate fs events reliably.
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: PriorityPollingInterval
    volumes:
      # Only src/ is live — NOT the whole ./backend, so backend/.env (real
      # secrets, used for the non-Docker workflow) never reaches the
      # container. See the comment in backend/Dockerfile.
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Seen by the browser bundle (import.meta.env.VITE_API_URL).
      VITE_API_URL: /api
      # Seen only by the Vite dev server process, to proxy /api/* to the
      # backend container. Keeps the browser calling same-origin, so this
      # works from a phone on the LAN without touching CORS.
      VITE_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: 'true'
    volumes:
      # Only src/ is live — NOT the whole ./frontend, so frontend/.env never
      # reaches the container either (same reasoning as the backend).
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    logging:
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
